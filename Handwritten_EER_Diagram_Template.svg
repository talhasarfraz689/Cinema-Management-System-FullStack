    <rect width="255" height="310" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2" rx="4"/>
    <rect width="255" height="34" fill="#FCE7F3" stroke="#1E3A8A" stroke-width="1.2" rx="4"/>
    <text x="127" y="23" font-size="14" font-weight="bold" fill="#9D174D" text-anchor="middle">PremiumScreen (Subclass)</text>
    <line x1="0" y1="34" x2="255" y2="34" stroke="#1E3A8A" stroke-width="1.5"/>

    <g transform="translate(14, 55)" font-size="11.5" fill="#0F172A">
      <text x="0" y="0" font-weight="bold" text-decoration="underline" fill="#1E3A8A">&#8226; Screen_ID (PK, FK)</text>
      <text x="0" y="22">&#8226; Luxury_Level (VIP Presidential)</text>
      <text x="0" y="44">&#8226; Private_Balcony_Seats (INT)</text>
      <text x="0" y="66">&#8226; Wine_Bar_Access (BIT)</text>
      <text x="0" y="88">&#8226; VIP_Restroom_Access (BIT)</text>
      <text x="0" y="110">&#8226; Heated_Seats (BIT)</text>
      <text x="0" y="132">&#8226; Acoustic_Damping_Rating</text>
      <text x="0" y="154">&#8226; Coat_Check_Available (BIT)</text>
      <text x="0" y="176">&#8226; Concierge_Desk_Station</text>
      <text x="0" y="198">&#8226; Noise_Isolation_Db (65 dB)</text>
      
      <rect x="-4" y="215" width="235" height="28" fill="#FCE7F3" stroke="#EC4899" stroke-width="0.8" rx="3"/>
      <text x="6" y="234" font-size="10.5" fill="#9D174D">Strictly 10 Attributes (+12 inherited)</text>
    </g>
  </g>

  <!-- Subclass 4: SilverScreen (10 Attributes) -->
  <g transform="translate(875, 840)" filter="url(#handShadow)">
    <rect width="255" height="310" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2" rx="4"/>
    <rect width="255" height="34" fill="#F1F5F9" stroke="#1E3A8A" stroke-width="1.2" rx="4"/>
    <text x="127" y="23" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">SilverScreen (Subclass)</text>
    <line x1="0" y1="34" x2="255" y2="34" stroke="#1E3A8A" stroke-width="1.5"/>

