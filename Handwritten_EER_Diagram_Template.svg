      <text x="0" y="22">&#8226; Discount_Tier_Percent (20%)</text>
      <text x="0" y="44">&#8226; Economy_Bundle_Eligible (BIT)</text>
      <text x="0" y="66">&#8226; Student_Pass_Accepted (BIT)</text>
      <text x="0" y="88">&#8226; Group_Discount_Active (BIT)</text>
      <text x="0" y="110">&#8226; Free_Refill_Eligible (BIT)</text>
      <text x="0" y="132">&#8226; Aisle_Ramp_Access (BIT)</text>
      <text x="0" y="154">&#8226; Booster_Seat_Quantity (INT)</text>
      <text x="0" y="176">&#8226; Bulk_Ticket_Eligible (BIT)</text>
      <text x="0" y="198">&#8226; Matinee_Discount_Rate (0.25)</text>
      
      <rect x="-4" y="215" width="235" height="28" fill="#F1F5F9" stroke="#64748B" stroke-width="0.8" rx="3"/>
      <text x="6" y="234" font-size="10.5" fill="#334155">Strictly 10 Attributes (+12 inherited)</text>
    </g>
  </g>

  <!-- Structural Mapping Box -->
  <g transform="translate(65, 1180)">
    <rect width="1065" height="230" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="1.5" rx="6"/>
    <text x="25" y="30" font-size="15" font-weight="bold" fill="#1E3A8A">MAPPING TO RELATIONAL MODEL (Option 8.1.A - Multiple Relations for Superclass &amp; Subclasses):</text>
    
    <g transform="translate(25, 60)" font-size="12" fill="#0F172A">
      <text x="0" y="0"><tspan font-weight="bold">1. Screen</tspan> ( <tspan text-decoration="underline" font-weight="bold" fill="#1E3A8A">Screen_ID</tspan>, Screen_Name, Screen_Type, Total_Capacity, Row_Count, Seats_Per_Row, Sound_System, Projector_Model, Screen_Width_Feet, Screen_Height_Feet, Cleaning_Status, Is_Active )</text>
      <text x="0" y="25"><tspan font-weight="bold">2. IMAXScreen</tspan> ( <tspan text-decoration="underline" font-weight="bold" fill="#1E3A8A">Screen_ID</tspan>, Laser_Projection_Type, Aspect_Ratio, Dual_Laser_3D, Curved_Angle_Degrees, Audio_Channel_Count, Max_Screen_Luminance_Nits, HFR_Supported, Calibration_Frequency_Days, Commercial_License_Code )</text>
      <text x="0" y="50"><tspan font-weight="bold">3. GoldScreen</tspan> ( <tspan text-decoration="underline" font-weight="bold" fill="#1E3A8A">Screen_ID</tspan>, Lounge_Service_Type, Recliner_Model, Butler_Service_Enabled, Complimentary_Snack_Tier, Call_Button_Active, USB_Charging_Speed_Watts, Legrest_Angle_Max, Pillow_Blanket_Provided, Lounge_Access_Code )</text>
      <text x="0" y="75"><tspan font-weight="bold">4. PremiumScreen</tspan> ( <tspan text-decoration="underline" font-weight="bold" fill="#1E3A8A">Screen_ID</tspan>, Luxury_Level, Private_Balcony_Seats, Wine_Bar_Access, VIP_Restroom_Access, Heated_Seats, Acoustic_Damping_Rating, Coat_Check_Available, Concierge_Desk_Station, Noise_Isolation_Db )</text>
      <text x="0" y="100"><tspan font-weight="bold">5. SilverScreen</tspan> ( <tspan text-decoration="underline" font-weight="bold" fill="#1E3A8A">Screen_ID</tspan>, Discount_Tier_Percent, Economy_Bundle_Eligible, Student_Pass_Accepted, Group_Discount_Active, Free_Refill_Eligible, Aisle_Ramp_Access, Booster_Seat_Quantity, Bulk_Ticket_Eligible, Matinee_Discount_Rate )</text>
      
      <line x1="0" y1="120" x2="1015" y2="120" stroke="#93C5FD" stroke-width="1"/>
      <text x="0" y="142" font-weight="bold" fill="#1E3A8A">Integrity Constraints:</text>
      <text x="160" y="142">FK: <tspan font-style="italic">Screen_ID</tspan> in every subclass references <tspan font-style="italic">Screen(Screen_ID)</tspan> ON DELETE CASCADE ON UPDATE CASCADE.</text>
    </g>
  </g>

  <!-- Bottom Verification Block -->
  <g transform="translate(65, 1440)">
    <rect width="1065" height="90" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" rx="4"/>
    <line x1="700" y1="0" x2="700" y2="90" stroke="#94A3B8" stroke-width="1"/>
    
    <text x="20" y="30" font-size="12" font-weight="bold" fill="#1E3A8A">EVALUATION CHECKLIST &amp; VERIFICATION STAMP:</text>
    <text x="20" y="55" font-size="11" fill="#334155">&#9745; Superclass Entity with 12 attributes | &#9745; 4 Specialized Subclasses (IMAX, Gold, Premium, Silver)</text>
    <text x="20" y="75" font-size="11" fill="#334155">&#9745; Strictly 10 attributes per subclass | &#9745; Total Specialization (=) &amp; Disjointness (d) constraint</text>
    
    <text x="720" y="30" font-size="12" font-weight="bold" fill="#1E3A8A">INSTRUCTOR SIGNATURE / EVALUATION:</text>
    <text x="720" y="58" font-size="11" fill="#64748B">Date Checked: ____________________</text>
    <text x="720" y="78" font-size="11" fill="#64748B">Marks Awarded: _____ / 20</text>
  </g>
</svg>