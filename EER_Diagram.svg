<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 920" width="100%" height="100%" style="background-color: #0F172A; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="superGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="subGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="subGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="subGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="subGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="575" y="45" font-size="24" font-weight="bold" fill="#F8FAFC" text-anchor="middle">ENHANCED ENTITY-RELATIONSHIP (EER) DIAGRAM</text>
  <text x="575" y="75" font-size="14" fill="#38BDF8" text-anchor="middle">Screen Specialization Hierarchy (Disjoint &amp; Total Participation) — Strictly 10 Attributes per Subclass</text>

  <!-- Superclass: SCREEN (12 Attributes) -->
  <g transform="translate(405, 110)" filter="url(#shadow)">
    <rect width="340" height="230" rx="12" fill="url(#superGrad)" stroke="#60A5FA" stroke-width="2"/>
    <rect width="340" height="42" rx="12" fill="#172554"/>
    <text x="170" y="28" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SCREEN (Superclass - 12 Attrs)</text>
    
    <g transform="translate(15, 60)" font-size="11" fill="#E2E8F0">
      <text x="0" y="0" font-weight="bold" text-decoration="underline" fill="#93C5FD">&#9642; Screen_ID (PK) : INT</text>
      <text x="0" y="18">&#9642; Screen_Name : VARCHAR(50) [UNIQUE]</text>
      <text x="0" y="36">&#9642; Screen_Type : VARCHAR(30) [DISCRIMINATOR]</text>
      <text x="0" y="54">&#9642; Total_Capacity : INT [CHECK &gt; 0]</text>
      <text x="0" y="72">&#9642; Row_Count, Seats_Per_Row : INT</text>
      <text x="0" y="90">&#9642; Sound_System : VARCHAR(50)</text>
      <text x="0" y="108">&#9642; Projector_Model : VARCHAR(80)</text>
      <text x="0" y="126">&#9642; Screen_Width_Feet, Screen_Height_Feet : FLOAT</text>
      <text x="0" y="144">&#9642; Cleaning_Status : VARCHAR(30), Is_Active : BIT</text>
    </g>
  </g>

  <!-- Total Participation Double Line from Superclass to Circle -->
  <line x1="573" y1="340" x2="573" y2="420" stroke="#F8FAFC" stroke-width="2.5"/>
  <line x1="577" y1="340" x2="577" y2="420" stroke="#F8FAFC" stroke-width="2.5"/>
  <text x="590" y="380" font-size="11" fill="#F8FAFC" font-weight="bold">Total (=)</text>

  <!-- Disjoint Constraint Circle 'd' -->
  <circle cx="575" cy="445" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="3" filter="url(#shadow)"/>
  <text x="575" y="454" font-size="22" font-weight="bold" fill="#38BDF8" text-anchor="middle">d</text>
  <text x="615" y="450" font-size="11" fill="#38BDF8" font-weight="bold">Disjoint (d)</text>

  <!-- Connector Lines to Subclasses -->
  <path d="M 555 465 L 155 550" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <path d="M 565 470 L 425 550" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <path d="M 585 470 L 715 550" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <path d="M 595 465 L 985 550" stroke="#94A3B8" stroke-width="2" fill="none"/>

  <!-- Subclass 1: IMAXScreen (10 Attributes) -->
  <g transform="translate(25, 550)" filter="url(#shadow)">
    <rect width="260" height="280" rx="10" fill="url(#subGrad1)" stroke="#A78BFA" stroke-width="2"/>
    <rect width="260" height="36" rx="10" fill="#2E1065"/>
    <text x="130" y="24" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">IMAXScreen (10 Attrs)</text>
    
    <g transform="translate(12, 54)" font-size="10.5" fill="#EDE9FE">
      <text x="0" y="0" font-weight="bold" text-decoration="underline" fill="#DDD6FE">&#9642; Screen_ID (PK, FK) : INT</text>
      <text x="0" y="20">&#9642; Laser_Projection_Type : VARCHAR</text>
      <text x="0" y="40">&#9642; Aspect_Ratio : VARCHAR ('1.43:1')</text>
      <text x="0" y="60">&#9642; Dual_Laser_3D : BIT</text>
      <text x="0" y="80">&#9642; Curved_Angle_Degrees : FLOAT</text>
      <text x="0" y="100">&#9642; Audio_Channel_Count : INT (12)</text>
      <text x="0" y="120">&#9642; Max_Screen_Luminance_Nits : INT</text>
      <text x="0" y="140">&#9642; HFR_Supported : BIT</text>
      <text x="0" y="160">&#9642; Calibration_Frequency_Days : INT</text>
      <text x="0" y="180">&#9642; Commercial_License_Code [UQ]</text>
    </g>
  </g>

  <!-- Subclass 2: GoldScreen (10 Attributes) -->
  <g transform="translate(305, 550)" filter="url(#shadow)">
    <rect width="260" height="280" rx="10" fill="url(#subGrad2)" stroke="#FBBF24" stroke-width="2"/>
    <rect width="260" height="36" rx="10" fill="#451A03"/>
    <text x="130" y="24" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GoldScreen (10 Attrs)</text>
    
    <g transform="translate(12, 54)" font-size="10.5" fill="#FEF3C7">
      <text x="0" y="0" font-weight="bold" text-decoration="underline" fill="#FDE68A">&#9642; Screen_ID (PK, FK) : INT</text>
      <text x="0" y="20">&#9642; Lounge_Service_Type : VARCHAR</text>
      <text x="0" y="40">&#9642; Recliner_Model : VARCHAR</text>
      <text x="0" y="60">&#9642; Butler_Service_Enabled : BIT</text>
      <text x="0" y="80">&#9642; Complimentary_Snack_Tier</text>
      <text x="0" y="100">&#9642; Call_Button_Active : BIT</text>
      <text x="0" y="120">&#9642; USB_Charging_Speed_Watts</text>
      <text x="0" y="140">&#9642; Legrest_Angle_Max : INT (160)</text>
      <text x="0" y="160">&#9642; Pillow_Blanket_Provided : BIT</text>
      <text x="0" y="180">&#9642; Lounge_Access_Code [UQ]</text>
    </g>
  </g>

  <!-- Subclass 3: PremiumScreen (10 Attributes) -->
  <g transform="translate(585, 550)" filter="url(#shadow)">
    <rect width="260" height="280" rx="10" fill="url(#subGrad3)" stroke="#F472B6" stroke-width="2"/>
    <rect width="260" height="36" rx="10" fill="#500724"/>
    <text x="130" y="24" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PremiumScreen (10 Attrs)</text>
    
    <g transform="translate(12, 54)" font-size="10.5" fill="#FDF2F8">
      <text x="0" y="0" font-weight="bold" text-decoration="underline" fill="#FBCFE8">&#9642; Screen_ID (PK, FK) : INT</text>
      <text x="0" y="20">&#9642; Luxury_Level : VARCHAR(50)</text>
      <text x="0" y="40">&#9642; Private_Balcony_Seats : INT</text>
      <text x="0" y="60">&#9642; Wine_Bar_Access : BIT</text>
      <text x="0" y="80">&#9642; VIP_Restroom_Access : BIT</text>
      <text x="0" y="100">&#9642; Heated_Seats : BIT</text>
      <text x="0" y="120">&#9642; Acoustic_Damping_Rating</text>
      <text x="0" y="140">&#9642; Coat_Check_Available : BIT</text>
      <text x="0" y="160">&#9642; Concierge_Desk_Station</text>
      <text x="0" y="180">&#9642; Noise_Isolation_Db : INT</text>
    </g>
  </g>

  <!-- Subclass 4: SilverScreen (10 Attributes) -->
  <g transform="translate(865, 550)" filter="url(#shadow)">
    <rect width="260" height="280" rx="10" fill="url(#subGrad4)" stroke="#94A3B8" stroke-width="2"/>
    <rect width="260" height="36" rx="10" fill="#0F172A"/>
    <text x="130" y="24" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SilverScreen (10 Attrs)</text>
    
    <g transform="translate(12, 54)" font-size="10.5" fill="#F1F5F9">
      <text x="0" y="0" font-weight="bold" text-decoration="underline" fill="#E2E8F0">&#9642; Screen_ID (PK, FK) : INT</text>
      <text x="0" y="20">&#9642; Discount_Tier_Percent : INT</text>
      <text x="0" y="40">&#9642; Economy_Bundle_Eligible : BIT</text>
      <text x="0" y="60">&#9642; Student_Pass_Accepted : BIT</text>
      <text x="0" y="80">&#9642; Group_Discount_Active : BIT</text>
      <text x="0" y="100">&#9642; Free_Refill_Eligible : BIT</text>
      <text x="0" y="120">&#9642; Aisle_Ramp_Access : BIT</text>
      <text x="0" y="140">&#9642; Booster_Seat_Quantity : INT</text>
      <text x="0" y="160">&#9642; Bulk_Ticket_Eligible : BIT</text>
      <text x="0" y="180">&#9642; Matinee_Discount_Rate : REAL</text>
    </g>
  </g>

  <!-- Explanatory note -->
  <text x="575" y="870" font-size="12" fill="#94A3B8" text-anchor="middle">Inheritance: Subclasses inherit all 12 attributes from Screen superclass, giving each subtype 22 effective relational attributes.</text>
</svg>