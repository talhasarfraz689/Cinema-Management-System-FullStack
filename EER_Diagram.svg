<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #0F172A; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="superGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="subGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="subGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="subGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="subGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="550" y="45" font-size="24" font-weight="bold" fill="#F8FAFC" text-anchor="middle">ENHANCED ENTITY-RELATIONSHIP (EER) DIAGRAM</text>
  <text x="550" y="75" font-size="14" fill="#94A3B8" text-anchor="middle">Screen Specialization / Generalization Hierarchy (Disjoint &amp; Total Participation)</text>

  <!-- Superclass: SCREEN -->
  <g transform="translate(380, 110)" filter="url(#shadow)">
    <rect width="340" height="230" rx="12" fill="url(#superGrad)" stroke="#60A5FA" stroke-width="2"/>
    <rect width="340" height="42" rx="12" fill="#172554"/>
    <text x="170" y="28" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SCREEN (Superclass)</text>
    
    <g transform="translate(15, 60)" font-size="11.5" fill="#E2E8F0">
      <text x="0" y="0" font-weight="bold" text-decoration="underline" fill="#93C5FD">&#9642; Screen_ID (PK) : INT</text>
      <text x="0" y="20">&#9642; Screen_Name : VARCHAR(50) [UNIQUE]</text>
      <text x="0" y="40">&#9642; Screen_Type : VARCHAR(30) [DISCRIMINATOR]</text>
      <text x="0" y="60">&#9642; Total_Capacity : INT [CHECK &gt; 0]</text>
      <text x="0" y="80">&#9642; Row_Count, Seats_Per_Row : INT</text>
      <text x="0" y="100">&#9642; Sound_System : VARCHAR(50)</text>
      <text x="0" y="120">&#9642; Projector_Model : VARCHAR(80)</text>
      <text x="0" y="140">&#9642; Screen_Width_Feet, Screen_Height_Feet : FLOAT</text>
      <text x="0" y="160">&#9642; Cleaning_Status : VARCHAR(30), Is_Active : BIT</text>
    </g>
  </g>

  <!-- Total Participation Double Line from Superclass to Circle -->
  <line x1="548" y1="340" x2="548" y2="420" stroke="#F8FAFC" stroke-width="2"/>
  <line x1="552" y1="340" x2="552" y2="420" stroke="#F8FAFC" stroke-width="2"/>
  <text x="565" y="380" font-size="11" fill="#F8FAFC" font-weight="bold">Total (=)</text>

  <!-- Disjoint Constraint Circle 'd' -->
  <circle cx="550" cy="445" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="3" filter="url(#shadow)"/>
  <text x="550" y="454" font-size="22" font-weight="bold" fill="#38BDF8" text-anchor="middle">d</text>
  <text x="590" y="450" font-size="11" fill="#38BDF8" font-weight="bold">Disjoint (d)</text>

  <!-- Connector Lines to Subclasses -->
  <path d="M 530 465 L 150 560" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <path d="M 540 470 L 410 560" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <path d="M 560 470 L 690 560" stroke="#94A3B8" stroke-width="2" fill="none"/>
  <path d="M 570 465 L 950 560" stroke="#94A3B8" stroke-width="2" fill="none"/>

  <!-- Subclass 1: IMAXScreen -->
  <g transform="translate(30, 560)" filter="url(#shadow)">
    <rect width="240" height="220" rx="10" fill="url(#subGrad1)" stroke="#A78BFA" stroke-width="2"/>
    <rect width="240" height="36" rx="10" fill="#2E1065"/>
    <text x="120" y="24" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">IMAXScreen</text>
    
    <g transform="translate(12, 54)" font-size="11" fill="#EDE9FE">
      <text x="0" y="0" font-weight="bold" text-decoration="underline" fill="#DDD6FE">&#9642; Screen_ID (PK, FK)</text>
      <text x="0" y="22">&#9642; Laser_Projection_Type</text>
      <text x="0" y="42">&#9642; Aspect_Ratio ('1.43:1')</text>
      <text x="0" y="62">&#9642; Dual_Laser_3D (BIT)</text>
      <text x="0" y="82">&#9642; Curved_Angle_Degrees</text>
      <text x="0" y="102">&#9642; License_Code (UNIQUE)</text>
      <rect x="0" y="118" width="216" height="32" rx="6" fill="#2E1065" opacity="0.6"/>
      <text x="6" y="138" font-size="10" fill="#DDD6FE">Inherits 12 Screen Attrs</text>
    </g>
  </g>

  <!-- Subclass 2: GoldScreen -->
  <g transform="translate(290, 560)" filter="url(#shadow)">
    <rect width="240" height="220" rx="10" fill="url(#subGrad2)" stroke="#FBBF24" stroke-width="2"/>
    <rect width="240" height="36" rx="10" fill="#451A03"/>
    <text x="120" y="24" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GoldScreen</text>
    
    <g transform="translate(12, 54)" font-size="11" fill="#FEF3C7">
      <text x="0" y="0" font-weight="bold" text-decoration="underline" fill="#FDE68A">&#9642; Screen_ID (PK, FK)</text>
      <text x="0" y="22">&#9642; Lounge_Service_Type</text>
      <text x="0" y="42">&#9642; Recliner_Model</text>
      <text x="0" y="62">&#9642; Butler_Service (BIT)</text>
      <text x="0" y="82">&#9642; Snack_Tier</text>
      <text x="0" y="102">&#9642; Call_Button_Active (BIT)</text>
      <rect x="0" y="118" width="216" height="32" rx="6" fill="#451A03" opacity="0.6"/>
      <text x="6" y="138" font-size="10" fill="#FDE68A">Inherits 12 Screen Attrs</text>
    </g>
  </g>

  <!-- Subclass 3: PremiumScreen -->
  <g transform="translate(570, 560)" filter="url(#shadow)">
    <rect width="240" height="220" rx="10" fill="url(#subGrad3)" stroke="#F472B6" stroke-width="2"/>
    <rect width="240" height="36" rx="10" fill="#500724"/>
    <text x="120" y="24" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PremiumScreen</text>
    
    <g transform="translate(12, 54)" font-size="11" fill="#FCE7F3">
      <text x="0" y="0" font-weight="bold" text-decoration="underline" fill="#FBCFE8">&#9642; Screen_ID (PK, FK)</text>
      <text x="0" y="22">&#9642; Luxury_Level</text>
      <text x="0" y="42">&#9642; Balcony_Seats (INT)</text>
      <text x="0" y="62">&#9642; Wine_Bar_Access (BIT)</text>
      <text x="0" y="82">&#9642; VIP_Restroom_Access</text>
      <text x="0" y="102">&#9642; Heated_Seats (BIT)</text>
      <rect x="0" y="118" width="216" height="32" rx="6" fill="#500724" opacity="0.6"/>
      <text x="6" y="138" font-size="10" fill="#FBCFE8">Inherits 12 Screen Attrs</text>
    </g>
  </g>

  <!-- Subclass 4: SilverScreen -->
  <g transform="translate(830, 560)" filter="url(#shadow)">
    <rect width="240" height="220" rx="10" fill="url(#subGrad4)" stroke="#94A3B8" stroke-width="2"/>
    <rect width="240" height="36" rx="10" fill="#0F172A"/>
    <text x="120" y="24" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SilverScreen</text>
    
    <g transform="translate(12, 54)" font-size="11" fill="#F1F5F9">
      <text x="0" y="0" font-weight="bold" text-decoration="underline" fill="#CBD5E1">&#9642; Screen_ID (PK, FK)</text>
      <text x="0" y="22">&#9642; Discount_Tier_Percent</text>
      <text x="0" y="42">&#9642; Economy_Bundle (BIT)</text>
      <text x="0" y="62">&#9642; Student_Pass (BIT)</text>
      <text x="0" y="82">&#9642; Group_Discount (BIT)</text>
      <text x="0" y="102">&#9642; Free_Refill_Eligible</text>
      <rect x="0" y="118" width="216" height="32" rx="6" fill="#0F172A" opacity="0.6"/>
      <text x="6" y="138" font-size="10" fill="#CBD5E1">Inherits 12 Screen Attrs</text>
    </g>
  </g>

  <!-- Constraints Annotation Box -->
  <g transform="translate(30, 110)" filter="url(#shadow)">
    <rect width="320" height="150" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="16" y="28" font-size="13" font-weight="bold" fill="#38BDF8">&#128204; EER CONSTRAINTS SUMMARY</text>
    <text x="16" y="55" font-size="11" fill="#E2E8F0">&#9656; Constraint: Disjointness ('d')</text>
    <text x="16" y="73" font-size="10.5" fill="#94A3B8">  A screen can belong to ONLY ONE subclass.</text>
    <text x="16" y="98" font-size="11" fill="#E2E8F0">&#9656; Participation: Total (Double Line '=')</text>
    <text x="16" y="116" font-size="10.5" fill="#94A3B8">  Every screen MUST belong to a subclass.</text>
    <text x="16" y="138" font-size="10.5" fill="#38BDF8">  Relational Mapping: Option 8.1.A</text>
  </g>
</svg>
